# Non-secret local configuration. Set OPENAI_API_KEY only in your environment.
timezone: America/Sao_Paulo
profile_dir: ~/.config/jobbot/profile
mode: auto
auto_enabled: true
auto_adapter_allowlist: [greenhouse@14]
telegram_submit_adapter_allowlist: [greenhouse]
# Auto is disabled by default. These conservative fixed caps apply when enabled.
auto_daily_limit: 1
auto_daily_ats_limit: 1
auto_daily_company_limit: 1
auto_cooldown_seconds: 1800
auto_reservation_ttl_seconds: 900
auto_failure_threshold: 1
# Auto sends only allowlisted, fully eligible forms; exceptions go to Telegram.
request_timeout_seconds: 30
max_download_bytes: 10000000
# Allow up to US$0.50/day for evaluation and resume tailoring.
ai_daily_budget_micros: 500000
evidence_retention_days: 30
scheduled_career_sources:
  # Small Greenhouse boards first so supported applications fit in each run.
  - index_url: https://job-boards.greenhouse.io/rdsourcing
    allowed_hosts: [job-boards.greenhouse.io]
    allowed_path_prefixes: [/rdsourcing]
    robots_allowed: true
    terms_allowed: true
