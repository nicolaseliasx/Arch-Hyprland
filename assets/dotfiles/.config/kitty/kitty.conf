# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
#font_family Hack Nerd Font Mono Bold
#font_family Mononoki Nerd Font Mono Bold
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 1.0
dynamic_background_opacity 0
confirm_os_window_close 0

# Animated cursor
cursor_trail 0

# change to x11 or wayland or leave auto
linux_display_server wayland

# Keep Wayland, but avoid aggressive render settings while debugging crashes.
input_delay 3
repaint_delay 10
sync_to_monitor yes
wayland_enable_ime no

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

# Layouts and split navigation
enabled_layouts splits,tall,stack
map ctrl+shift+enter launch --location=split
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+plus resize_window wider
map ctrl+shift+minus resize_window narrower
map ctrl+shift+backspace close_window

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd


allow_remote_control yes
