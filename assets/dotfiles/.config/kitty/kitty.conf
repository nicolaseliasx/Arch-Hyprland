# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
#font_family Hack Nerd Font Mono Bold
#font_family Mononoki Nerd Font Mono Bold
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 1.0
dynamic_background_opacity 0
confirm_os_window_close 0

# Animated cursor
cursor_trail 0

# change to x11 or wayland or leave auto
linux_display_server wayland

# Keep Wayland, but avoid aggressive render settings while debugging crashes.
input_delay 3
repaint_delay 10
sync_to_monitor yes
wayland_enable_ime no

# Omni tabs can use all available space; other tabs keep the previous 40-cell cap.
tab_bar_style custom
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"
tab_title_max_length 40

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

# Layouts and split navigation
enabled_layouts splits,tall,stack
map ctrl+shift+d launch --location=split
map ctrl+shift+plus resize_window wider
map ctrl+shift+minus resize_window narrower
map ctrl+shift+backspace close_window

# Tab management
map alt+s new_tab
map alt+w close_tab
map alt+d next_tab
map alt+a previous_tab
map ctrl+shift+w discard_event
map ctrl+shift+e discard_event
map ctrl+shift+q discard_event
# Disable Kitty's default directional/tab navigation with arrow keys.
map ctrl+shift+left discard_event
map ctrl+shift+right discard_event
map ctrl+shift+up discard_event
map ctrl+shift+down discard_event
map ctrl+shift+y open_url_with_hints
map --allow-fallback=shifted,ascii ctrl+shift+t

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd


allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omni-kitty-{kitty_pid}.sock
