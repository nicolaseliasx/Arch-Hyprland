# Minimal lock screen: primary monitor only.

$lock_font = FantasqueSansM Nerd Font Mono
$lock_fg = rgba(115, 115, 115, 1.0)
$lock_muted = rgba(80, 80, 80, 1.0)
$lock_border = rgba(100, 100, 100, 0.8)
$lock_black = rgba(0, 0, 0, 1.0)

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    color = $lock_black
    blur_passes = 0
    noise = 0
}

# Small, subdued content in the lower-right corner of the primary display.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lock_fg
    font_size = 56
    font_family = $lock_font
    position = -56, 132
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%A, %B %-d" | tr '[:lower:]' '[:upper:]'
    color = $lock_muted
    font_size = 16
    font_family = $lock_font
    position = -56, 78
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=C uptime -p
    color = $lock_muted
    font_size = 14
    font_family = $lock_font
    position = -56, 52
    halign = right
    valign = bottom
}

input-field {
    monitor =
    size = 250, 48
    outline_thickness = 1
    dots_size = 0.16
    dots_spacing = 0.14
    dots_center = true
    dots_rounding = 0
    outer_color = $lock_border
    inner_color = $lock_black
    font_color = $lock_fg
    fade_on_empty = false
    font_family = $lock_font
    placeholder_text = Password
    hide_input = false
    rounding = 0
    check_color = $lock_border
    fail_color = rgba(180, 70, 70, 0.9)
    capslock_color = $lock_muted
    position = -56, 4
    halign = right
    valign = bottom
}
